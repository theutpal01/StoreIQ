# Project-wide Gradle settings

# JVM settings for Gradle daemon
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:+UseStringDeduplication

# Parallel execution
org.gradle.parallel=true
org.gradle.workers.max=4

# Caching
org.gradle.caching=true
org.gradle.configuration-cache=true

# Daemon
org.gradle.daemon=true

# Kotlin daemon
kotlin.daemon=true
kotlin.daemon.jvm.options=-Xmx2g

# Android
android.nonTransitiveRClass=true
android.enableArtifactTransforms=true
android.experimental.buildSpeedLogging=true
android.useAndroidX=true

# R8/ProGuard
android.enableR8=true
android.enableR8FullMode=true

# Build cache
android.buildCache=true

# Jetifier
android.enableJetifier=true

# Compose
android.compose.compiler.version=1.5.11

# Kotlin
kotlin.version=1.9.22

# AGP
android.gradlepugin.version=8.4.0

# Version catalogs
libs.versions.toml=true