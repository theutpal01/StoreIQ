# Detekt configuration for StorIQ - minimal config for detekt 1.23.4

build:
  maxIssues: 100
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

console-reports:
  active: true
  exclude:
    - FunctionOnlyReturningConstant
    - UnusedPrivateMember

output-reports:
  active: true
  exclude:
    - FunctionOnlyReturningConstant
    - UnusedPrivateMember

config:
  validation: true

# Disable all rule sets - we rely on baseline
comments:
  active: false
complexity:
  active: false
coroutines:
  active: false
empty-blocks:
  active: false
exceptions:
  active: false
naming:
  active: false
performance:
  active: false
potential-bugs:
  active: false
style:
  active: false